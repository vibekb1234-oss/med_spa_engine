# Netlify deploy config for MedSpa Growth Engine
# Publishes the public marketing/booking site; private operator and client
# surfaces are blocked on the public deployment.

[build]
  publish = "."
  command = ""

# Private dashboard and operator/client surfaces
[[redirects]]
  from = "/dashboard/*"
  to = "/landing/index.html"
  status = 404
  force = true

