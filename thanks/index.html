<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

body{min-height:100vh;display:grid;place-items:center;background:var(--page-bg);color:var(--text);font-family:var(--font-body);padding:24px}.card{width:min(620px,100%);border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:34px;box-shadow:var(--shadow-lg)}h1{font-family:var(--font-heading);font-size:clamp(32px,6vw,58px);line-height:1;margin:0 0 14px;color:var(--text-strong)}p{color:var(--text-muted);font-size:17px;line-height:1.65}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--border);background:var(--accent);color:var(--accent-contrast);font-weight:800;text-decoration:none}.btn.secondary{background:transparent;color:var(--text)}
