<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0b12"/>
      <stop offset="100%" stop-color="#1d1929"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d94d85"/>
      <stop offset="100%" stop-color="#55c7b1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f07ab0"/>
      <stop offset="100%" stop-color="#55c7b1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid backdrop -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- brand mark -->
  <rect x="80" y="80" width="80" height="80" rx="18" fill="url(#mark)"/>
  <text x="120" y="138" text-anchor="middle" font-family="Geist, sans-serif" font-size="48" font-weight="800" fill="#ffffff">M</text>

  <!-- brand text -->
  <text x="180" y="118" font-family="Geist, sans-serif" font-size="26" font-weight="700" fill="#fff7fb">MedSpa Growth Engine</text>
  <text x="180" y="148" font-family="Geist Mono, monospace" font-size="14" letter-spacing="3" fill="#a89ca8">MANAGED AUTOMATION OS</text>

  <!-- headline -->
  <text x="80" y="290" font-family="Geist, sans-serif" font-size="62" font-weight="700" fill="#fff7fb">Turn missed follow-up into</text>
  <text x="80" y="370" font-family="Geist, sans-serif" font-size="62" font-weight="700" fill="url(#accent)">repeat bookings, reviews, referrals.</text>

  <!-- subtitle -->
  <text x="80" y="440" font-family="Geist, sans-serif" font-size="22" fill="#a89ca8">Done-for-you automation for independent aesthetic clinics.</text>
  <text x="80" y="472" font-family="Geist, sans-serif" font-size="22" fill="#a89ca8">8 workflows. One dashboard. 7-day setup. No SaaS migration.</text>

  <!-- footer chips -->
  <g font-family="Geist Mono, monospace" font-size="14" letter-spacing="2">
    <rect x="80" y="530" width="180" height="40" rx="20" fill="none" stroke="#3a3048" stroke-width="1"/>
    <text x="170" y="556" text-anchor="middle" fill="#f07ab0">8 WORKFLOWS</text>

    <rect x="280" y="530" width="220" height="40" rx="20" fill="none" stroke="#3a3048" stroke-width="1"/>
    <text x="390" y="556" text-anchor="middle" fill="#f07ab0">GMAIL + SHEETS + N8N</text>

    <rect x="520" y="530" width="160" height="40" rx="20" fill="none" stroke="#3a3048" stroke-width="1"/>
    <text x="600" y="556" text-anchor="middle" fill="#f07ab0">NOT SAAS</text>
  </g>
</svg>
